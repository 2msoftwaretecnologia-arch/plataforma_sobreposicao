{% load report_extras %}
<table class="report-table">
    <thead>
        <tr>
            <th>Uso / vegetação</th>
            <th>Bioma (% de Reserva Legal)</th>
            <th class="num">Área</th>
            <th class="num">Reserva Legal exigida</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.nome|default:"-" }}</td>
            <td>{{ item.tipo|default:"-" }}</td>
            <td class="num">{{ item.area|ha }}</td>
            <td class="num">{{ item.preserved_area|ha }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Nenhum registro encontrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
