{% load report_extras %}
<table class="report-table">
    <thead>
        <tr>
            <th>Imóvel certificado</th>
            <th>Situação</th>
            <th class="num">Área em comum</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.nome|default:"-" }}</td>
            <td>{{ item.status|default:"-"|lower|capfirst }}</td>
            <td class="num">{{ item.area|ha }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Nenhum registro encontrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
