{% load report_extras %}
<table class="report-table">
    <thead>
        <tr>
            <th>Zona</th>
            <th>O que significa</th>
            <th class="num">Área</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>
                {{ item.zona|default:"-" }}
                {% if item.sigla %}<span class="code-chip">{{ item.sigla }}</span>{% endif %}
            </td>
            <td>{{ item.sigla|zoning_meaning }}</td>
            <td class="num">{{ item.area|ha }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Nenhum registro encontrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
