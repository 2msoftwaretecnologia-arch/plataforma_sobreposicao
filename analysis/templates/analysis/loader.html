{% load static %}
<!-- Loader overlay (sem rota própria): camadas em sobreposição.
     Três placas isométricas (terreno, imóvel do CAR e bases ambientais) se
     empilham; o perímetro do imóvel é desenhado, um feixe varre as bases e a
     área sobreposta pisca. Animação toda em CSS (loader.css). -->
<div id="page-loader" class="loader-overlay" aria-hidden="true">
    <div class="loader-anim" role="img" aria-label="Camadas do mapa se sobrepondo enquanto o imóvel é analisado">
        <svg viewBox="0 0 240 270" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <defs>
                <pattern id="ld-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="6" height="6" fill="rgba(185, 98, 47, 0.18)"/>
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#b9622f" stroke-width="2.2"/>
                </pattern>
                <linearGradient id="ld-beam" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                    <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
                    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>
                <clipPath id="ld-plate-clip">
                    <rect x="-50" y="-50" width="100" height="100"/>
                </clipPath>
            </defs>

            <ellipse class="ld-shadow" cx="120" cy="252" rx="86" ry="12"/>

            <!-- Terreno: talhões vistos de cima -->
            <g class="ld-plate ld-plate--bottom">
                <g transform="translate(120 135)">
                    <path class="ld-edge" d="M-86.6 0 L0 50 L86.6 0 L86.6 7 L0 57 L-86.6 7 Z" fill="#1f4029"/>
                    <g transform="matrix(0.866 0.5 -0.866 0.5 0 0)">
                        <rect x="-50" y="-50" width="100" height="100" fill="#2b5a38"/>
                        <g stroke="rgba(251, 248, 240, 0.22)" stroke-width="0.8">
                            <rect x="-50" y="-50" width="45" height="35" fill="#3a7a4b"/>
                            <rect x="-5" y="-50" width="55" height="25" fill="#6b8f3a"/>
                            <rect x="-50" y="-15" width="30" height="40" fill="#4f8f5a"/>
                            <rect x="-20" y="-15" width="40" height="30" fill="#9a8a45"/>
                            <rect x="20" y="-25" width="30" height="45" fill="#3a7a4b"/>
                            <rect x="-50" y="25" width="60" height="25" fill="#6b8f3a"/>
                            <rect x="10" y="20" width="40" height="30" fill="#4f8f5a"/>
                        </g>
                    </g>
                </g>
            </g>

            <!-- Imóvel do CAR: o perímetro é desenhado vértice a vértice -->
            <g class="ld-plate ld-plate--middle">
                <g transform="translate(120 135)">
                    <path class="ld-edge" d="M-86.6 0 L0 50 L86.6 0 L86.6 4 L0 54 L-86.6 4 Z" fill="rgba(23, 48, 31, 0.35)"/>
                    <g transform="matrix(0.866 0.5 -0.866 0.5 0 0)">
                        <rect x="-50" y="-50" width="100" height="100" fill="rgba(251, 248, 240, 0.16)" stroke="rgba(251, 248, 240, 0.7)" stroke-width="0.9"/>
                        <path d="M-30 -28 L18 -36 L36 -6 L26 30 L-12 34 L-36 10 Z" fill="none"
                            stroke="rgba(201, 143, 45, 0.55)" stroke-width="1.2" stroke-dasharray="3 3"/>
                        <path class="ld-property-fill"d="M-30 -28 L18 -36 L36 -6 L26 30 L-12 34 L-36 10 Z" fill="rgba(219, 166, 63, 0.3)"/>
                        <path class="ld-property" d="M-30 -28 L18 -36 L36 -6 L26 30 L-12 34 L-36 10 Z" pathLength="100"
                            fill="none" stroke="#dba63f" stroke-width="2.6" stroke-linejoin="round"/>
                        <g class="ld-vertices" fill="#fbf8f0" stroke="#c98f2d" stroke-width="1.2">
                            <circle cx="-30" cy="-28" r="2.4"/>
                            <circle cx="18" cy="-36" r="2.4"/>
                            <circle cx="36" cy="-6" r="2.4"/>
                            <circle cx="26" cy="30" r="2.4"/>
                            <circle cx="-12" cy="34" r="2.4"/>
                            <circle cx="-36" cy="10" r="2.4"/>
                        </g>
                    </g>
                </g>
            </g>

            <!-- Bases ambientais: rio, área restrita e a varredura -->
            <g class="ld-plate ld-plate--top">
                <g transform="translate(120 135)">
                    <path class="ld-edge" d="M-86.6 0 L0 50 L86.6 0 L86.6 4 L0 54 L-86.6 4 Z" fill="rgba(23, 48, 31, 0.3)"/>
                    <g transform="matrix(0.866 0.5 -0.866 0.5 0 0)">
                        <rect x="-50" y="-50" width="100" height="100" fill="rgba(74, 163, 223, 0.14)" stroke="rgba(251, 248, 240, 0.75)" stroke-width="0.9"/>
                        <path d="M-50 18 C-25 8 -15 30 5 20 S35 -5 50 -10" fill="none" stroke="#4aa3df" stroke-width="3.2" stroke-linecap="round"/>
                        <path d="M8 -50 L50 -50 L50 -14 L22 -4 L4 -24 Z" fill="url(#ld-hatch)" stroke="#b9622f" stroke-width="1.2"/>
                        <path class="ld-overlap" d="M8 -33 L18 -36 L31 -14 L22 -4 L6 -22 Z" fill="#e0533a" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                        <g clip-path="url(#ld-plate-clip)">
                            <rect class="ld-beam" x="-9" y="-50" width="18" height="100" fill="url(#ld-beam)"/>
                        </g>
                    </g>
                </g>
            </g>
        </svg>
    </div>
    <div class="loader-status" aria-live="polite">
        <span id="loader-status-text" class="loader-status__text">Preparando análise...</span>
    </div>
</div>

<script src="{% static 'analysis/js/loader.js' %}" defer></script>
