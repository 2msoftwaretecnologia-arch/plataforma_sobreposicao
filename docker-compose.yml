version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: overlay-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - overlay-db-data:/var/lib/postgresql/data
    # Só no próprio servidor (use um túnel SSH para acessar da sua máquina).
    ports:
      - "127.0.0.1:${OVERLAY_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: overlay-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "127.0.0.1:${OVERLAY_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${OVERLAY_RABBITMQ_ADMIN_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: overlay-redis
    ports:
      - "127.0.0.1:${OVERLAY_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: overlay-app
    working_dir: /app
    command: bash -c "
      python manage.py migrate &&
      python manage.py collectstatic --no-input --clear &&
      uwsgi --ini /etc/uwsgi/uwsgi.ini
      "
    volumes:
      - ./:/app
    environment:
      - DJANGO_SETTINGS_MODULE=kernel.settings
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
      - HOST_BD=db
      - PORT_BD=5432
      - REDIS_URL=redis://redis:6379/1
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - GEOS_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgeos_c.so
    env_file:
      - .env
    ports:
      - "127.0.0.1:${OVERLAY_APP_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: overlay-app:latest
    container_name: celery-worker
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -c "celery -A kernel worker -l info"
    environment:
      - DJANGO_SETTINGS_MODULE=kernel.settings
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
      - HOST_BD=db
      - PORT_BD=5432
      - REDIS_URL=redis://redis:6379/1
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - GEOS_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgeos_c.so
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    image: overlay-app:latest
    container_name: celery-beat
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -c "celery -A kernel beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    environment:
      - DJANGO_SETTINGS_MODULE=kernel.settings
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
      - HOST_BD=db
      - PORT_BD=5432
      - REDIS_URL=redis://redis:6379/1
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - GEOS_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgeos_c.so
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: overlay-nginx
    ports:
      - "${OVERLAY_HTTP_PORT:-8020}:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  overlay-db-data:
