# Site da plataforma no Nginx do HOST (o que já atende as outras aplicações da VPS).
#
# Dá à plataforma um nome com HTTPS válido sem comprar domínio: o sslip.io
# resolve sobreposicao.82-25-66-238.sslip.io para 82.25.66.238. O Nginx do
# host termina o TLS e repassa para o nginx do docker-compose (porta 8020),
# que separa o /mcp (servidor MCP) do resto (Django).
#
# Instalação (passo a passo em mcp_connector/README.md):
#   sudo cp mcp_connector/deploy/nginx-host-sslip.conf /etc/nginx/sites-available/plataforma-sobreposicao
#   sudo ln -s /etc/nginx/sites-available/plataforma-sobreposicao /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sobreposicao.82-25-66-238.sslip.io --redirect
#
# O certbot acrescenta sozinho o bloco "listen 443 ssl" e o redirecionamento
# de HTTP para HTTPS, e renova o certificado automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name sobreposicao.82-25-66-238.sslip.io;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Uma análise completa leva até ~1 min.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
