upstream app_upstream {
    server overlay-app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        try_files $uri =404;
        # A maioria dos templates referencia os estáticos sem cache-buster
        # (só `report_print.html` usa `?v=STATIC_VERSION`), então o cache não
        # pode ser "immutable"/de longo prazo: um deploy que troque o
        # conteúdo de um CSS/JS sem renomeá-lo ficaria escondido do usuário
        # até o cache expirar. 1h dá alívio de repique sem esse risco.
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Conector MCP (Claude e ChatGPT): o servidor MCP e os metadados do recurso
    # protegido (RFC 9728) ficam no serviço mcp; login e tokens OAuth seguem
    # no app. O nome é resolvido a cada requisição (DNS do Docker): sem o
    # container mcp, só estas rotas dão 502 e o nginx continua subindo.
    location ~ ^/(mcp|\.well-known/oauth-protected-resource)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://overlay-mcp:8002;
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Uma análise completa leva até ~1 min.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app_upstream;
        # Preserva a porta publica nas URLs absolutas dos tiles do mapa.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
    }
}
