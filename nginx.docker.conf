upstream app_upstream {
    server overlay-app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        try_files $uri =404;
        # A maioria dos templates referencia os estáticos sem cache-buster
        # (só `report_print.html` usa `?v=STATIC_VERSION`), então o cache não
        # pode ser "immutable"/de longo prazo: um deploy que troque o
        # conteúdo de um CSS/JS sem renomeá-lo ficaria escondido do usuário
        # até o cache expirar. 1h dá alívio de repique sem esse risco.
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
    }
}
